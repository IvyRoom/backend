# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - Plataforma-Backend-v3

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '.agents/**'
      - '.github/dependabot.yml'
      - '.github/workflows/face-sdk-version-check.yml'
      - '.github/workflows/main_plataforma-backend-v3.yml'
      - '.gitignore'
      - 'docs/**'
      - 'test/**'
  workflow_dispatch:

permissions: {}

concurrency:
  group: backend-production-deployment
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Build application if configured
        run: npm run build --if-present

      - name: Test application
        run: npm test

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write # Required for the existing Azure OIDC login.

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_AACE8F1C06984344AB9368E0D8C1A4B1 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_AF580FBC452A47249036380D5B580268 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_BEAD3B4ADB564E74AF231299B06E1AB3 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        id: deploy-to-webapp
        with:
          app-name: 'Plataforma-Backend-v3'
          slot-name: 'Production'
          package: .
