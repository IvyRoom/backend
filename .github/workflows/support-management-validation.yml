name: Validate support management

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'support-*.js'
      - 'domains/support-*.js'
      - 'integrations/support-*.js'
      - 'integrations/pagarme.js'
      - 'app.js'
      - 'server.js'
      - 'package*.json'
      - 'test/**'
      - '.github/workflows/support-management-validation.yml'

permissions: {}

concurrency:
  group: support-management-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    name: Validate support management
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Test application
        run: npm test
