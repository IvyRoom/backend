name: Propose Face Liveness SDK updates

on:
  schedule:
    - cron: '23 12 * * 2'
  workflow_dispatch:
    inputs:
      target_version:
        description: Optional exact Face Liveness Web SDK version
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: face-sdk-update
  cancel-in-progress: false

jobs:
  propose:
    if: >-
      github.repository == 'IvyRoom/backend' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    name: Prepare a review-only SDK proposal
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: face-sdk-automation
      deployment: false
    env:
      FACE_SDK_WORKSPACE_NAME: face-sdk-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check out Backend main without persisted credentials
        uses: actions/checkout@v7
        with:
          path: backend
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Check out Sistemas main without persisted credentials
        uses: actions/checkout@v7
        with:
          repository: IvyRoom/sistemas
          path: sistemas
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          package-manager-cache: false

      - name: Download and inspect the private packages
        id: prepare
        working-directory: backend
        shell: bash
        env:
          AZURE_FACE_API_ENDPOINT: ${{ secrets.AZURE_FACE_API_ENDPOINT }}
          AZURE_FACE_API_KEY: ${{ secrets.AZURE_FACE_API_KEY }}
          REQUESTED_FACE_SDK_VERSION: ${{ inputs.target_version }}
        run: |
          set -euo pipefail
          requested_version="${REQUESTED_FACE_SDK_VERSION:-latest}"
          workspace="$RUNNER_TEMP/$FACE_SDK_WORKSPACE_NAME"
          node scripts/prepare-face-sdk-update.mjs \
            --backend-root "$GITHUB_WORKSPACE/backend" \
            --sistemas-root "$GITHUB_WORKSPACE/sistemas" \
            --workspace "$workspace" \
            --temp-root "$RUNNER_TEMP" \
            --requested-version "$requested_version" \
            --github-output "$GITHUB_OUTPUT"

      - name: Verify deterministic proposal metadata
        if: steps.prepare.outputs['update-available'] == 'true'
        shell: bash
        env:
          PROPOSED_VERSION: ${{ steps.prepare.outputs['target-version'] }}
          PROPOSED_BRANCH: ${{ steps.prepare.outputs.branch }}
        run: |
          set -euo pipefail
          [[ "$PROPOSED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          expected_branch="chore/update-face-liveness-sdk-${PROPOSED_VERSION//./-}"
          [[ "$PROPOSED_BRANCH" == "$expected_branch" ]]

      - name: Validate the complete Backend candidate
        if: steps.prepare.outputs['update-available'] == 'true'
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --check app.js
          node --check server.js
          node --check platform-row-authorization.js
          node --check domains/quote-requests.js
          node --check domains/conecta-recommendations.js
          node --check domains/client-onboarding.js
          node --check domains/learning-platform.js
          node --check domains/drm.js
          node --check domains/certificate-validation.js
          node --check integrations/microsoft-graph.js
          node --check integrations/azure-face.js
          node --check shared/retry.js
          node --check shared/escape-html.js
          node --check scripts/prepare-face-sdk-update.mjs
          npm test
          git diff --check

      - name: Validate the credential-free Sistemas candidate
        if: steps.prepare.outputs['update-available'] == 'true'
        working-directory: sistemas
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/face-sdk-vendor-lib.mjs
          node --check scripts/update-face-sdk-vendor.mjs
          node --check scripts/check-face-sdk-vendor.mjs
          node scripts/check-face-sdk-vendor.mjs
          git diff --check

      - name: Verify candidate change boundaries
        if: steps.prepare.outputs['update-available'] == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t backend_status < <(
            git -C backend status --porcelain=v1 -z --untracked-files=all --no-renames
          )
          [[ ${#backend_status[@]} -eq 1 ]]
          [[ "${backend_status[0]:0:2}" == ' M' ]]
          [[ "${backend_status[0]:3}" == 'docs/runbooks/update-face-liveness-sdk.md' ]]

          mapfile -d '' -t sistemas_status < <(
            git -C sistemas status --porcelain=v1 -z --untracked-files=all --no-renames
          )
          [[ ${#sistemas_status[@]} -gt 0 ]]
          for status_record in "${sistemas_status[@]}"; do
            [[ "${status_record:0:2}" != *R* && "${status_record:0:2}" != *C* ]]
            changed_path="${status_record:3}"
            case "$changed_path" in
              apps/learning-platform/azure-ai-vision-face-ui/*|scripts/face-sdk-vendor.json) ;;
              *) echo "Unexpected Sistemas candidate path: $changed_path" >&2; exit 1 ;;
            esac
          done

      - name: Remove every temporary private package
        if: always()
        shell: bash
        run: |
          node --input-type=module -e '
            import { rm } from "node:fs/promises";
            import path from "node:path";
            const temporaryRoot = path.resolve(process.env.RUNNER_TEMP);
            const workspace = path.resolve(temporaryRoot, process.env.FACE_SDK_WORKSPACE_NAME);
            if (path.dirname(workspace) !== temporaryRoot || !path.basename(workspace).startsWith("face-sdk-")) {
              throw new Error("Refusing to clean a path outside the runner temporary root.");
            }
            await rm(workspace, { recursive: true, force: true });
          '

      - name: Create least-privilege publication token
        if: steps.prepare.outputs['update-available'] == 'true'
        id: publication-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.FACE_SDK_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACE_SDK_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            backend
            sistemas
          permission-contents: write
          permission-pull-requests: write

      - name: Commit both validated candidates
        if: steps.prepare.outputs['update-available'] == 'true'
        shell: bash
        env:
          PROPOSED_VERSION: ${{ steps.prepare.outputs['target-version'] }}
          PROPOSED_BRANCH: ${{ steps.prepare.outputs.branch }}
        run: |
          set -euo pipefail
          for repository in backend sistemas; do
            git -C "$repository" switch -c "$PROPOSED_BRANCH"
            git -C "$repository" config user.name 'github-actions[bot]'
            git -C "$repository" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          done

          git -C backend add -- docs/runbooks/update-face-liveness-sdk.md
          git -C sistemas add -- \
            apps/learning-platform/azure-ai-vision-face-ui \
            scripts/face-sdk-vendor.json

          git -C backend diff --cached --quiet && {
            echo 'Backend candidate did not contain a reviewable change.' >&2
            exit 1
          }
          git -C sistemas diff --cached --quiet && {
            echo 'Sistemas candidate did not contain a reviewable change.' >&2
            exit 1
          }

          for repository in backend sistemas; do
            git -C "$repository" commit \
              -m "chore(face-sdk): propose $PROPOSED_VERSION" \
              -m 'Co-Authored-By: Codex <codex@openai.com>'
            [[ -z "$(git -C "$repository" status --porcelain=v1 --untracked-files=all)" ]]
          done

      - name: Publish branches and idempotent cross-linked draft pull requests
        if: steps.prepare.outputs['update-available'] == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.publication-token.outputs.token }}
          FACE_SDK_APP_TOKEN: ${{ steps.publication-token.outputs.token }}
          CURRENT_VERSION: ${{ steps.prepare.outputs['current-version'] }}
          PROPOSED_VERSION: ${{ steps.prepare.outputs['target-version'] }}
          PROPOSED_BRANCH: ${{ steps.prepare.outputs.branch }}
          VENDOR_FILES: ${{ steps.prepare.outputs['vendor-files'] }}
          VENDOR_BYTES: ${{ steps.prepare.outputs['vendor-bytes'] }}
          VENDOR_SHA256: ${{ steps.prepare.outputs['vendor-sha256'] }}
        run: |
          set -euo pipefail
          owner="$GITHUB_REPOSITORY_OWNER"
          askpass="$(mktemp "$RUNNER_TEMP/face-sdk-git-askpass.XXXXXX")"
          remote_changes_file=''
          trap 'rm -f -- "$askpass" "${remote_changes_file:-}"' EXIT
          printf '%s\n' \
            '#!/bin/sh' \
            'case "$1" in' \
            '  *Username*) printf "%s\n" "x-access-token" ;;' \
            '  *) printf "%s\n" "$FACE_SDK_APP_TOKEN" ;;' \
            'esac' > "$askpass"
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0

          assert_main_tips_unchanged() {
            local repository remote local_main remote_main
            for repository in backend sistemas; do
              remote="https://github.com/$owner/$repository.git"
              local_main="$(git -C "$repository" rev-parse main)"
              remote_main="$(git -C "$repository" ls-remote "$remote" refs/heads/main | cut -f1)"
              if [[ -z "$remote_main" || "$remote_main" != "$local_main" ]]; then
                echo "The $repository main branch advanced while the proposal was prepared; retry from fresh main tips." >&2
                exit 1
              fi
            done
          }

          assert_main_tips_unchanged

          find_pull_request() {
            gh api --method GET "repos/$owner/$1/pulls" \
              -f state=open \
              -f base=main \
              -f "head=$owner:$PROPOSED_BRANCH" \
              --jq '.[0] | if . == null then "" else "\(.number)\t\(.draft)" end'
          }

          find_closed_pull_request() {
            gh api --method GET "repos/$owner/$1/pulls" \
              -f state=closed \
              -f base=main \
              -f "head=$owner:$PROPOSED_BRANCH" \
              --jq '.[0].number // empty'
          }

          for repository in backend sistemas; do
            open_branches="$(
              gh api --paginate --method GET "repos/$owner/$repository/pulls" \
                -f state=open \
                -f base=main \
                -f per_page=100 \
                --jq ".[] | select(.head.repo.full_name == \"$owner/$repository\") | select(.head.ref | startswith(\"chore/update-face-liveness-sdk-\")) | .head.ref"
            )"
            while IFS= read -r open_branch; do
              if [[ -n "$open_branch" && "$open_branch" != "$PROPOSED_BRANCH" ]]; then
                echo "An earlier Face SDK proposal remains open in $repository." >&2
                exit 1
              fi
            done <<< "$open_branches"
          done

          backend_record="$(find_pull_request backend)"
          sistemas_record="$(find_pull_request sistemas)"
          ready_pair=false
          if [[ -n "$backend_record" && -n "$sistemas_record" ]]; then
            backend_draft="${backend_record#*$'\t'}"
            sistemas_draft="${sistemas_record#*$'\t'}"
            if [[ "$backend_draft" != "$sistemas_draft" ]]; then
              echo 'The companion proposals have inconsistent draft states.' >&2
              exit 1
            fi
            [[ "$backend_draft" == 'true' ]] || ready_pair=true
          fi
          for repository in backend sistemas; do
            record_name="${repository}_record"
            record="${!record_name}"
            if [[ -n "$record" && "${record#*$'\t'}" != 'true' && "$ready_pair" != 'true' ]]; then
              echo "The matching $repository proposal is ready but its companion is not." >&2
              exit 1
            fi
            closed_record="$(find_closed_pull_request "$repository")"
            if [[ -z "$record" && -n "$closed_record" ]]; then
              echo "The matching $repository proposal was closed or merged; it will not be recreated." >&2
              exit 1
            fi
          done

          declare -A remote_shas
          for repository in backend sistemas; do
            remote="https://github.com/$owner/$repository.git"
            remote_sha="$(git -C "$repository" ls-remote "$remote" "refs/heads/$PROPOSED_BRANCH" | cut -f1)"
            remote_shas[$repository]="$remote_sha"
            if [[ -n "$remote_sha" ]]; then
              remote_ref="refs/remotes/face-sdk-existing/$repository"
              git -C "$repository" fetch --no-tags "$remote" \
                "refs/heads/$PROPOSED_BRANCH:$remote_ref"
              merge_base="$(git -C "$repository" merge-base main "$remote_ref")"
              remote_changes_file="$(mktemp "$RUNNER_TEMP/face-sdk-remote-changes.XXXXXX")"
              git -C "$repository" diff --no-renames --name-only -z \
                "$merge_base" "$remote_ref" > "$remote_changes_file"
              mapfile -d '' -t remote_changes < "$remote_changes_file"
              rm -f -- "$remote_changes_file"
              remote_changes_file=''
              for changed_path in "${remote_changes[@]}"; do
                case "$repository:$changed_path" in
                  backend:docs/runbooks/update-face-liveness-sdk.md|sistemas:scripts/face-sdk-vendor.json|sistemas:apps/learning-platform/azure-ai-vision-face-ui/*) ;;
                  *) echo "Existing $repository proposal branch contains an unexpected path." >&2; exit 1 ;;
                esac
              done
              if [[ "$repository" == 'backend' ]]; then
                comparison_paths=(docs/runbooks/update-face-liveness-sdk.md)
              else
                comparison_paths=(
                  apps/learning-platform/azure-ai-vision-face-ui
                  scripts/face-sdk-vendor.json
                )
              fi
              git -C "$repository" diff --quiet \
                "$remote_ref" "$PROPOSED_BRANCH" -- "${comparison_paths[@]}" || {
                  echo "Existing $repository proposal branch has a different candidate." >&2
                  exit 1
                }
            fi
          done

          if [[ "$ready_pair" == 'true' ]]; then
            [[ -n "${remote_shas[backend]}" && -n "${remote_shas[sistemas]}" ]]
            echo 'Both matching proposals are already ready for review and retain the validated candidates.'
            exit 0
          fi

          for repository in backend sistemas; do
            if [[ -z "${remote_shas[$repository]}" ]]; then
              remote="https://github.com/$owner/$repository.git"
              git -C "$repository" push "$remote" \
                "$PROPOSED_BRANCH:refs/heads/$PROPOSED_BRANCH"
            fi
          done

          create_pull_request() {
            local repository="$1"
            gh api --method POST "repos/$owner/$repository/pulls" \
              -f "title=chore(face-sdk): propose $PROPOSED_VERSION" \
              -f "head=$PROPOSED_BRANCH" \
              -f base=main \
              -F draft=true \
              -f body= \
              --jq '.number'
          }

          update_managed_body() {
            local repository="$1"
            local pull_request="$2"
            local companion_label="$3"
            local companion_url="$4"
            local current_body managed_block updated_body before after_start after_end
            local managed_start='<!-- face-sdk-automation:start -->'
            local managed_end='<!-- face-sdk-automation:end -->'
            current_body="$(gh api --method GET "repos/$owner/$repository/pulls/$pull_request" --jq '.body // ""')"
            printf -v managed_block '%s\n%s\n\n%s: %s\n%s' \
              "$managed_start" "$common_body" "$companion_label" "$companion_url" "$managed_end"
            case "$current_body" in
              *"$managed_start"*)
                before="${current_body%%"$managed_start"*}"
                after_start="${current_body#*"$managed_start"}"
                case "$after_start" in
                  *"$managed_start"*) echo "The $repository proposal contains duplicate automation markers." >&2; exit 1 ;;
                esac
                case "$after_start" in
                  *"$managed_end"*) ;;
                  *) echo "The $repository proposal contains an incomplete automation block." >&2; exit 1 ;;
                esac
                after_end="${after_start#*"$managed_end"}"
                case "$after_end" in
                  *"$managed_end"*) echo "The $repository proposal contains duplicate automation markers." >&2; exit 1 ;;
                esac
                updated_body="${before}${managed_block}${after_end}"
                ;;
              *"$managed_end"*)
                echo "The $repository proposal contains an incomplete automation block." >&2
                exit 1
                ;;
              '') updated_body="$managed_block" ;;
              *) printf -v updated_body '%s\n\n%s' "$current_body" "$managed_block" ;;
            esac
            gh api --method PATCH "repos/$owner/$repository/pulls/$pull_request" \
              --silent \
              -f "body=$updated_body"
          }

          backend_pr="${backend_record%%$'\t'*}"
          sistemas_pr="${sistemas_record%%$'\t'*}"
          [[ -n "$backend_pr" ]] || backend_pr="$(create_pull_request backend)"
          [[ -n "$sistemas_pr" ]] || sistemas_pr="$(create_pull_request sistemas)"

          backend_url="https://github.com/$owner/backend/pull/$backend_pr"
          sistemas_url="https://github.com/$owner/sistemas/pull/$sistemas_pr"
          release_url="https://www.npmjs.com/package/@azure/ai-vision-face-ui/v/$PROPOSED_VERSION"
          printf -v common_body '%s\n\n%s\n\n%s' \
            "This trusted Tuesday 12:23 UTC scheduled/manual automation detected a Face Liveness Web SDK update from $CURRENT_VERSION to $PROPOSED_VERSION and prepared a review-only draft." \
            "Vendor summary: $VENDOR_FILES files, $VENDOR_BYTES bytes, SHA-256 $VENDOR_SHA256. Public release page: $release_url" \
            "Private registry/API credentials were confined to the non-production face-sdk-automation environment and were removed before publication. The complete Backend suite and credential-free Sistemas structural checks passed before either branch was pushed, and temporary packages were cleaned on success or failure. Secret-free pull-request checks run the complete repository suites; intentionally frozen SDK, WASM, and artifact baselines may remain red until a maintainer qualifies the release. This branch is excluded from production deployment, preview creation/closure, Azure/OIDC credentials, and auto-merge. A maintainer must review the vendored files, release notes, compatibility baselines, and both validation results. Merge and verify the Sistemas proposal first, then merge the Backend version record; any cross-repository version drift makes the next scheduled run fail loudly."
          update_managed_body backend "$backend_pr" 'Companion Sistemas proposal' "$sistemas_url"
          update_managed_body sistemas "$sistemas_pr" 'Companion Backend proposal' "$backend_url"

          echo "Backend draft: $backend_url"
          echo "Sistemas draft: $sistemas_url"
